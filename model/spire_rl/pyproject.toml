[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spire-rl"
version = "0.1.0"
description = "Online PPO macro policy (Set Transformer + causal history) for the C++ Slay the Spire 2 simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.optional-dependencies]
tensorboard = ["tensorboard>=2.14"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["spire_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
