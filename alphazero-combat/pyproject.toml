[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azcombat-contracts"
version = "0.1.0"
description = "Isolated contracts for an AlphaZero-style single-player combat agent"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.1"]
export = ["torch>=2.1", "onnx>=1.16", "onnxruntime>=1.19", "numpy>=1.23"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
